apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels: 
    app.kubernetes.io/name: demo
    app.kubernetes.io/instance: backend
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: demo
      app.kubernetes.io/instance: backend
  replicas: 2
  template:
    metadata: 
      labels:
        app.kubernetes.io/name: demo
        app.kubernetes.io/instance: backend
    spec:
      containers:
        - name: backend
          image: {{.IMAGE}}
          imagePullPolicy: Always
          command:
            - /workspace/backend
          ports:
            - protocol: TCP
              containerPort: 20219
          resources:
            limits:
              memory: 50Mi
              cpu: 50m
      imagePullSecrets:
        - name: default-registry-secret
