apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: frontend
  name: frontend-rc-origin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - image: {{.IMAGE}}
        name: frontend
        ports:
        - containerPort: 80
          name: frontend
        resources:
          limits:
            memory: 60Mi
            cpu: 60m
